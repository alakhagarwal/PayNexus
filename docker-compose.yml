version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL 16 (Primary Relational Database)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: paynexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: ${DB_NAME:-paynexus_wallet}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-paynexus_wallet}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - paynexus-network

  # ---------------------------------------------------------------------------
  # 2. Redis 7 (Cache, Distributed Locks via Redisson, Idempotency Keys)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: paynexus-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - paynexus-network

  # ---------------------------------------------------------------------------
  # Redis Insight (Web GUI for Redis inspection, TTLs, Redisson locks)
  # ---------------------------------------------------------------------------
  redisinsight:
    image: redis/redisinsight:latest
    container_name: paynexus-redisinsight
    restart: unless-stopped
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - paynexus-network

  # ---------------------------------------------------------------------------
  # 3. Apache Kafka (Event Bus - KRaft Mode, No Zookeeper Required)
