server:
  port: 8083

spring:
  application:
    name: order-engine-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:paynexus_order_engine}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:Alakh@2004}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      # NEVER use 'create' or 'update' — Flyway manages schema. 'validate' just sanity-checks entities match DB.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true # prevents crashing if there is no schema table but other table are present

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

feign:
  circuitbreaker:
    enabled: true

market:
  feed:
    provider: simulation   # switch to 'upstox' when live token is in Redis

logging:
  level:
    com.paynexus.orderengineservice: DEBUG
    org.springframework.web: INFO