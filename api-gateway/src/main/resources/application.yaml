server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # Enable dynamic route lookup via Eureka service discovery
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      # Explicit Gateway Route Definitions
      routes:
        # 1. User Management & Authentication (wallet-service)
        - id: wallet-service-users
          uri: lb://wallet-service
          predicates:
            - Path=/api/v1/users/**

        # 2. Wallet Operations: Balance, P2P Transfers, Ledger History
        - id: wallet-service-wallets
          uri: lb://wallet-service
          predicates:
            - Path=/api/v1/wallet/**, /api/v1/wallets/**

        # 3. Payment Processing & Razorpay Webhooks
        - id: wallet-service-payments
          uri: lb://wallet-service
          predicates:
            - Path=/api/v1/payments/**

        # 4. Admin Management Operations
        - id: wallet-service-admin
          uri: lb://wallet-service
          predicates:
            - Path=/admin/**

        # 5. Internal Inter-Service Wallet Endpoints (Holds, Settlements)
        - id: wallet-service-internal
          uri: lb://wallet-service
          predicates:
            - Path=/internal/wallet/**

      # Global Cross-Origin Resource Sharing (CORS) Configuration
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
              - "http://127.0.0.1:3000"
              - "http://127.0.0.1:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

# Eureka Client Discovery Registration
eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# Logging Configuration
logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator: INFO
